version: 1
description: >-
  .env.example、Python、shell、Makefile、Composeの環境変数を分類する実行台帳。
  tested変数は実プロセスを再起動して観測し、excluded変数は理由なしでは登録できない。

sources:
  include:
    - .env.example
    - docker-compose.yml
    - Makefile
    - sherpa/**/*.py
    - scripts/**/*.sh
    - scripts/**/*.py
  exclude_from_discovery:
    - ui_automation/**
    - tests/**
    - .venv/**
  prefixes: [SHERPA_, OPENAI_, OLLAMA_, GEMINI_, AWS_, ANTHROPIC_, NEO4J_, POSTGRES_, PG, ES_, CODEX_]
  explicit_standard_names:
    - DATABASE_URL
    - ES_URL
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY
    - SSL_CERT_FILE
    - SSL_CERT_DIR
    - NODE_EXTRA_CA_CERTS
    - REQUESTS_CA_BUNDLE
    - CURL_CA_BUNDLE
    - CHROME_PATH
    - CODEX_HOME
    - HOME
    - TMPDIR
    - LAN
    - KEEP_STORES
    - PLAYWRIGHT_BROWSERS_PATH
    - ALL_PROXY
    - APP_PID_FILE
    - COMPOSE_PROJECT_NAME
    - DIFY_API_KEY
    - DIFY_BASE_URL
    - LANG
    - PATH
    - PLAYWRIGHT_HOME
    - PYTHONDONTWRITEBYTECODE
    - PYTHONUNBUFFERED
    - PYTHON_BIN
    - RUN_DIR
    - WSL_DISTRO_NAME
    - all_proxy
    - http_proxy
    - https_proxy
    - no_proxy
  dynamic_reference_exclusions:
    - path: scripts/azure_smoke.py
      function: _load_env_file
      kind: membership
      expression: key
      reason: 診断CLIが利用者指定envファイルの任意キーを汎用的に読み込む処理であり有限な製品runtime変数ではない
    - path: scripts/azure_smoke.py
      function: _load_env_file
      kind: subscript
      expression: key
      reason: 診断CLIが利用者指定envファイルの任意キーをos.environへ設定する汎用loaderであり個別変数へ展開できない
    - path: scripts/check-production.sh
      function: <shell>
      kind: shell-indirect
      expression: var
      reason: 固定列挙した永続データパス変数を同一検証へ渡す間接展開であり各キーは台帳で個別分類する
    - path: scripts/run-common.sh
      function: <shell>
      kind: shell-indirect
      expression: name
      reason: dotenvから読み込むキー名を引数で受ける共通処理であり呼出側の対象キーは台帳で個別分類する
    - path: scripts/run-common.sh
      function: <shell>
      kind: shell-indirect
      expression: pre_names
      reason: dotenv適用前に存在した任意キーを復元する共通処理であり有限な製品runtime変数ではない

classification_policy:
  unknown_variable_status: FAIL
  tested_requires_scenario_set: true
  tested_requires_restart: true
  tested_requires_observable: true
  excluded_requires_reason: true
  full_suite_skip_status: FAIL
  secrets_recording: presence-only
  precedence: explicit-process-env > SHERPA_ENV_FILE > product-default
  one_variable_at_a_time: true
  pairwise_for_interactions: true
  full_cartesian_product: false
  security_boundaries_are_individual_cases: true

scenario_catalog:
  standard:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: unsetして製品既定値と画面表示を確認
    valid: 既定とは異なる有効値を設定して反映を確認
    boundary: 空値または最小の有効値を確認
    invalid: 不正値がfail-closedまたは明示エラーになることを確認
    precedence: process env、専用env file、既定値の優先順を確認
    restart: 同じstackでアプリを再起動し、必要ならfresh stackでも確認
  boolean:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: unset時の既定ON/OFFを確認
    valid: "0と1を別プロセスで確認"
    boundary: 空値の扱いを確認
    invalid: 真偽値以外を成功扱いしないことを確認
    precedence: process envがenv fileより優先されることを確認
    restart: 変更前後でアプリを再起動して画面/API差分を確認
  numeric:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: unset時の既定値を確認
    valid: 既定とは異なる正数で上限または待機動作を確認
    boundary: "0、1、上限直前を変数の契約に応じて確認"
    invalid: 負数、非数、過大値の拒否または明示的縮退を確認
    precedence: process envがenv fileより優先されることを確認
    restart: アプリ再起動後のeffective valueを確認
  path:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: unset時の専用run directoryを確認
    valid: 空白と日本語を含む専用pathで確認
    boundary: 空ディレクトリまたはread-onlyディレクトリを確認
    invalid: 許可外、symlink、存在しないpathを安全に拒否することを確認
    precedence: process envがenv fileより優先されることを確認
    restart: appまたはstack再起動後も同じ物理領域を参照することを確認
  port:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: 専用動的portの採用を確認
    valid: 空いている別portで実接続を確認
    boundary: 1024以上の最小許可portと65535を確認
    invalid: 非数、範囲外、占有、接続URL不一致を起動前に拒否
    precedence: process envとenv fileとURL指定の優先・整合を確認
    restart: stack再作成後に旧portへ接続しないことを確認
  connection:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: localhostとport変数から組み立てた接続先を確認
    valid: 専用stackの明示URLでidentityを確認
    boundary: URL encodingが必要な資格情報で確認
    invalid: 名前解決不能、不正scheme、別stack identityを拒否
    precedence: 明示URLと個別portの優先・整合を確認
    restart: stackを再作成してidentityを再確認
  enum:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: unset時の自動選択または既定選択を確認
    valid: allowlist内の各値を実能力とともに確認
    boundary: 空値の意味を確認
    invalid: allowlist外を拒否または明示的に未選択とすることを確認
    precedence: process envがenv fileより優先されることを確認
    restart: アプリ再起動後の設定画面と実providerを照合
  secret:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: 未設定時に未接続と表示されることを確認
    valid: 実資格情報で実リクエストを行う
    boundary: 空白値を未設定として扱うことを確認
    invalid: placeholderまたは無効資格情報を成功扱いしない
    precedence: 初回seed前だけenvを採用することを確認
    restart: 値を記録せずset/unsetと接続結果だけを再確認
  seeded:
    required: [default, valid, boundary, invalid, precedence, restart]
    default: fresh databaseで未設定時の初期状態を確認
    valid: fresh databaseで初回seed結果を確認
    boundary: 空値をseed済み成功として扱わないことを確認
    invalid: 不正値を設定済みまたは接続成功として扱わない
    precedence: seed後はDB/UI設定がenv変更より優先されることを確認
    restart: 同じDBとfresh DBを分けて再起動する

execution:
  generate_profiles_from_variables: true
  reset_process_between_profiles: true
  fresh_stack_for_restart_values: [stack, seed]
  pairwise_groups:
    - id: connection-port-precedence
      variables: [SHERPA_ENV_FILE, SHERPA_PORT, DATABASE_URL, NEO4J_URI, ES_URL]
      profile: pairwise-connection-port-precedence
      case_nodeid: cases/environment/test_environment.py::test_effective_environment_contract
      observables: [healthz, ports, database-identity, compose-labels]
      profile_template: {restart: stack}
      factors:
        SHERPA_ENV_FILE:
          - {id: primary-run-file, process: {runtime: env_file_primary}}
          - {id: secondary-run-file, process: {runtime: env_file_secondary}}
        SHERPA_PORT:
          - {id: primary-port, process: {runtime: app_port_primary}}
          - id: process-over-env-file
            process: {runtime: app_port_secondary}
            env_file: {runtime: app_port_primary}
        DATABASE_URL:
          - {id: loopback-ip, process: {runtime: database_loopback}}
          - id: localhost-over-env-file
            process: {runtime: database_localhost}
            env_file: {runtime: database_loopback}
        NEO4J_URI:
          - {id: loopback-ip, process: {runtime: neo4j_loopback}}
          - id: localhost-over-env-file
            process: {runtime: neo4j_localhost}
            env_file: {runtime: neo4j_loopback}
        ES_URL:
          - {id: loopback-ip, process: {runtime: es_loopback}}
          - id: localhost-over-env-file
            process: {runtime: es_localhost}
            env_file: {runtime: es_loopback}
    - id: auth-session
      variables: [SHERPA_AUTH_DISABLED, SHERPA_COOKIE_SECURE, SHERPA_SESSION_DAYS]
      profile: pairwise-auth-session
      case_nodeid: cases/environment/test_environment.py::test_effective_environment_contract
      observables: [cookie-flags]
      profile_template: {restart: app}
      factors:
        SHERPA_AUTH_DISABLED:
          - {id: auth-enabled, process: {value: "0"}}
          - {id: auth-disabled, process: {value: "1"}}
        SHERPA_COOKIE_SECURE:
          - {id: explicit-zero, process: {value: "0"}}
          - {id: explicit-one, process: {value: "1"}}
        SHERPA_SESSION_DAYS:
          - {id: one-day, process: {value: "1"}}
          - {id: thirty-days, process: {value: "30"}}
    - id: ai-selection
      variables: [SHERPA_AGENT, SHERPA_EXTRA_AGENTS, OPENAI_API_KEY, OLLAMA_URL]
      profile: pairwise-ai-selection
      case_nodeid: cases/environment/test_environment.py::test_effective_environment_contract
      observables: [healthz, settings, navigation]
      profile_template:
        restart: app
        env: {SHERPA_AUTH_DISABLED: "0"}
      primary_marker: ui_automation
      primary_case_nodeids:
        - cases/environment/test_environment.py::test_effective_environment_contract
        - cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service
      factors:
        SHERPA_AGENT:
          - {id: openai, process: {value: openai}}
          - {id: codex, process: {value: codex}}
        SHERPA_EXTRA_AGENTS:
          - {id: gemini, process: {value: gemini}}
          - {id: bedrock, process: {value: bedrock}}
        OPENAI_API_KEY:
          - {id: inherited-real, process: {from_env: OPENAI_API_KEY}}
          - {id: unset, process: null, env_file: null}
        OLLAMA_URL:
          - {id: loopback-ip, process: {value: "http://127.0.0.1:11434"}}
          - {id: loopback-name, process: {value: "http://localhost:11434"}}
    - id: codex-mcp-sandbox-web
      variables: [SHERPA_CODEX_MCP, SHERPA_CODEX_SANDBOX, SHERPA_ALLOW_WEB_SEARCH]
      profile: pairwise-codex-mcp-sandbox-web
      case_nodeid: cases/environment/test_environment.py::test_effective_environment_contract
      observables: [healthz, settings, navigation]
      profile_template:
        restart: app
        env: {SHERPA_AUTH_DISABLED: "0", SHERPA_AGENT: codex}
      primary_marker: ui_automation
      primary_case_nodeids:
        - cases/environment/test_environment.py::test_effective_environment_contract
        - cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service
      factors:
        SHERPA_CODEX_MCP:
          - {id: enabled, process: {value: "1"}}
          - {id: disabled, process: {value: "0"}}
        SHERPA_CODEX_SANDBOX:
          - {id: enabled, process: {value: "1"}}
          - {id: disabled, process: {value: "0"}}
        SHERPA_ALLOW_WEB_SEARCH:
          - {id: disabled, process: {value: "0"}}
          - {id: enabled, process: {value: "1"}}
    - id: ingest-arms-ocr-vlm-legacy
      variables: [SHERPA_ARMS, SHERPA_OCR_ENABLED, SHERPA_VLM_PROVIDER, SHERPA_LEGACY_BACKEND]
      profile: pairwise-ingest-arms-ocr-vlm-legacy
      case_nodeid: cases/environment/test_environment.py::test_effective_environment_contract
      observables: [healthz, settings, database-identity, compose-labels]
      profile_template:
        restart: stack
        env: {SHERPA_AUTH_DISABLED: "0"}
      primary_marker: ui_automation
      primary_case_nodeids:
        - cases/environment/test_environment.py::test_effective_environment_contract
        - cases/worlds_ingest/test_worlds_ingest.py::test_real_pdf_image_ooxml_legacy_ingestion_evidence
      factors:
        SHERPA_ARMS:
          - {id: vision-enabled, process: {value: "ooxml,pdf_text,vision"}}
          - {id: text-office, process: {value: "ooxml,pdf_text"}}
        SHERPA_OCR_ENABLED:
          - {id: enabled, process: {value: "1"}}
          - {id: disabled, process: {value: "0"}}
        SHERPA_VLM_PROVIDER:
          - {id: ollama, process: {value: ollama}}
          - {id: openai, process: {value: openai}}
        SHERPA_LEGACY_BACKEND:
          - {id: libreoffice, process: {value: libreoffice}}
          - {id: none, process: {value: none}}
  fail_closed_groups:
    - [SHERPA_ENV_FILE, SHERPA_COMPOSE_PROJECT]
    - [PGPORT, DATABASE_URL]
    - [SHERPA_ES_PORT, ES_URL]
    - [SHERPA_NEO4J_BOLT_PORT, NEO4J_URI]
    - [SHERPA_BROWSE_ROOTS, SHERPA_OCR_WORLD_ROOT]
    - [SHERPA_KB_DIR, SHERPA_USERS_DIR, SHERPA_DERIVED_DIR, SHERPA_OBSERVATION_DIR]
    - [SHERPA_CODEX_SANDBOX, SHERPA_ALLOW_WEB_SEARCH]

execution_coverage:
  case_nodeid: cases/environment/test_environment.py::test_effective_environment_contract
  required_scenarios: [default, valid, boundary, invalid, precedence, restart]
  missing_status: FAIL
  description: >-
    変数を台帳へ書いただけでは実行済みにしない。各scenarioはここで実profileへ対応し、
    profileのresultとeffective-environment証跡がそろった場合だけcoverageを満たす。
  variables:
    SHERPA_AUTH_DISABLED:
      default: env-default
      valid: auth-disabled
      boundary: auth-enabled
      restart: auth-enabled
    SHERPA_EXEC_EVENT_V2:
      default: exec-event-v1
      valid: exec-event-v2
      boundary: exec-event-v1
      restart: exec-event-v2
    SHERPA_DISABLE_EMBED:
      default: env-default
      valid: disable-embed-present-zero
      boundary: disable-embed-present-zero
      restart: disable-embed-present-zero
    SHERPA_HISTORY_TURNS:
      default: env-default
      boundary: no-chat-history
      restart: no-chat-history
    SHERPA_HISTORY_MSG_CHARS:
      default: env-default
      boundary: no-chat-history
      restart: no-chat-history
    SHERPA_HISTORY_CHAR_BUDGET:
      default: env-default
      boundary: no-chat-history
      restart: no-chat-history
    SHERPA_STREAM_PACE:
      default: env-default
      boundary: env-precedence
      precedence: env-precedence
      restart: env-precedence
    PGPORT:
      default: env-default
      invalid: port-mismatch-rejected
      precedence: port-mismatch-rejected
      restart: port-mismatch-rejected
    DATABASE_URL:
      default: env-default
      invalid: invalid-database-url-rejected
      precedence: port-mismatch-rejected
      restart: invalid-database-url-rejected
    OLLAMA_URL:
      precedence: seed-ollama-url-persistence
      restart: seed-ollama-url-persistence
profiles:
  baseline-full:
    suites: [full]
    marker: ui_automation and not ingestion_real and not provider_profile_real
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_EXEC_EVENT_V2: "1"
      SHERPA_DISABLE_EMBED: null
    expected: [全required capabilityが実サービスで利用可能, 全caseを最後まで実行]
    observables: [healthz, health-summary, settings, database-identity, compose-labels]

  ingestion-real:
    suites: [full]
    marker: ingestion_real
    case_nodeids: [cases/worlds_ingest/test_worlds_ingest.py::test_real_pdf_image_ooxml_legacy_ingestion_evidence]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_OCR_ENABLED: "1"
      SHERPA_ARMS: ooxml,pdf_text,vision
      SHERPA_VLM_PROVIDER: ollama
      SHERPA_LEGACY_BACKEND: libreoffice
    expected_values: {vlm_provider: ollama, ocr_enabled: true}
    expected: [実OCRはvisionアームやVLM結果に依存せず原本とDB観測へ相関, 実VLM・OOXML・legacy Officeは各変換来歴へ相関]
    observables: [ocr-worker-state, observation, conversion-result, ingest-status]

  smoke-real:
    suites: [smoke]
    restart: stack
    fresh_database: true
    env: {SHERPA_AUTH_DISABLED: "0"}
    expected: [実FastAPIと実storeとChromiumへ接続]
    observables: [healthz, ui-shell, database-identity]

  chat-real:
    suites: [full, chat]
    marker: chat or thought_flow
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_AGENT: codex
      SHERPA_CODEX_MCP: "1"
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {agent: codex, exec_event_v2: true}
    expected: [実Codexターン, 非ゼロusage, 実tool node, DB永続化]
    observables: [sse, ui-trace, conversation-api, postgres, audit, usage]

  provider-openai-real:
    suites: [full, chat]
    marker: chat
    case_nodeids: [cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_AGENT: openai
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {agent: openai, exec_event_v2: true}
    expected: [実OpenAI providerを選択, 非ゼロusage, selected providerを永続化]
    observables: [settings, provider-probe, sse, postgres, usage]

  provider-ollama-real:
    suites: [full, chat]
    marker: chat
    case_nodeids: [cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_AGENT: ollama
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {agent: ollama, exec_event_v2: true}
    expected: [実Ollama providerを選択, 実model回答, selected providerを永続化]
    observables: [settings, ollama-probe, sse, postgres, usage]

  provider-gemini-real:
    suites: [full, chat]
    marker: chat
    case_nodeids: [cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_EXTRA_AGENTS: gemini
      SHERPA_AGENT: gemini
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {agent: gemini, exec_event_v2: true}
    expected: [実Gemini providerを選択, 実課金request, selected providerを永続化]
    observables: [settings, gemini-probe, sse, postgres, usage]

  provider-bedrock-real:
    suites: [full, chat]
    marker: chat
    case_nodeids: [cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_EXTRA_AGENTS: bedrock
      SHERPA_AGENT: bedrock
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {agent: bedrock, exec_event_v2: true}
    expected: [実Bedrock providerを選択, 実課金request, selected providerを永続化]
    observables: [settings, bedrock-probe, sse, postgres, usage]

  subagent-planner-real:
    suites: [full, chat]
    marker: subagent_planner_real
    case_nodeids: [cases/chat/test_subagent_planner.py::test_real_openai_planner_delegates_to_real_subagent]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_AGENT: openai
      SHERPA_SUBAGENTS_ENABLED: "1"
      SHERPA_USAGE_METERING: "1"
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {agent: openai, subagents_enabled: true, exec_event_v2: true}
    expected: [実OpenAI plannerが実subagentへ委譲しusageと監査を永続化]
    observables: [sse-tool-nodes, subagent-step-count, provider-usage, audit]

  auth-expiry-real:
    suites: [full, chat]
    marker: auth_expiry_real
    case_nodeids: [cases/chat/test_failure_profiles.py::test_expired_session_rejects_turn_and_releases_slot]
    restart: stack
    fresh_database: true
    env: {SHERPA_AUTH_DISABLED: "0"}
    expected_values: {failure_mode: session_expiry}
    expected: [失効済み実sessionを401で拒否し会話と実行slotを残さない]
    observables: [session-expiry, postgres-session, audit, turn-slot-release]

  provider-timeout-real:
    suites: [full, chat]
    marker: provider_timeout_real
    case_nodeids: [cases/chat/test_failure_profiles.py::test_real_provider_timeout_is_error_and_releases_slot]
    restart: stack
    fresh_database: true
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_AGENT: openai
      SHERPA_LLM_TIMEOUT: "0.05"
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {failure_mode: provider_timeout, agent: openai}
    expected: [実OpenAI timeoutを成功回答にせずUI・SSE・DB・監査へerrorとして保存]
    observables: [provider-duration, chat-error, turn-slot-release, audit]

  codex-cli-failure-real:
    suites: [full, chat]
    marker: codex_cli_failure_real
    case_nodeids: [cases/chat/test_failure_profiles.py::test_real_codex_cli_nonzero_is_error_and_releases_slot]
    restart: stack
    fresh_database: true
    codex_auth_mode: intentionally-unconfigured
    env:
      SHERPA_AUTH_DISABLED: "0"
      SHERPA_AGENT: codex
      OPENAI_API_KEY: null
      SHERPA_EXEC_EVENT_V2: "1"
    expected_values: {failure_mode: codex_cli_nonzero, agent: codex}
    expected: [実Codex CLIの非ゼロ終了を成功回答にせずUI・SSE・DB・監査へerrorとして保存]
    observables: [codex-invocation-summary, chat-error, turn-slot-release, audit]

  env-default:
    suites: [env]
    marker: environment
    restart: stack
    fresh_database: true
    env: {}
    expected: [専用env file未指定時もtest runnerの隔離値を採用]
    observables: [effective-environment, ports, compose-labels]

  env-precedence:
    suites: [env]
    marker: environment
    restart: stack
    fresh_database: true
    env: {SHERPA_STREAM_PACE: "0"}
    env_file: {SHERPA_STREAM_PACE: "0.35"}
    expected_values: {stream_pace: "0"}
    expected: [process envの0を採用]
    observables: [effective-environment, sse-timing]

  auth-disabled:
    suites: [env]
    marker: environment
    restart: app
    fresh_database: true
    env: {SHERPA_AUTH_DISABLED: "1"}
    expected_values: {auth_disabled: true}
    expected: [全requestをadminとして扱いloginへredirectしない]
    observables: [auth-me, navigation, admin-page]

  auth-enabled:
    suites: [env]
    marker: environment
    restart: app
    fresh_database: true
    env: {SHERPA_AUTH_DISABLED: "0"}
    expected_values: {auth_disabled: false}
    expected: [anonymousをloginへredirect, role境界を強制]
    observables: [login, auth-me, session-cookie, audit]

  exec-event-v1:
    suites: [env]
    marker: environment
    restart: app
    fresh_database: true
    env: {SHERPA_EXEC_EVENT_V2: "0"}
    expected_values: {exec_event_v2: false}
    expected: [v1 traceをUIとDBで復元]
    observables: [sse, ui-trace, postgres]

  exec-event-v2:
    suites: [env]
    marker: environment
    restart: app
    fresh_database: true
    env: {SHERPA_EXEC_EVENT_V2: "1"}
    expected_values: {exec_event_v2: true}
    expected: [v2 traceをUIとDBで復元]
    observables: [sse, ui-trace, postgres]

  disable-embed-present-zero:
    suites: [env]
    marker: environment
    restart: app
    fresh_database: true
    env: {SHERPA_DISABLE_EMBED: "0"}
    expected_values: {disable_embed_present: true}
    expected: [値が0でも変数の存在によりembeddingを無効化]
    observables: [app-log, ingest-result, elasticsearch-document]

  no-chat-history:
    suites: [env]
    marker: environment
    restart: app
    fresh_database: true
    env:
      SHERPA_AGENT: openai
      SHERPA_HISTORY_TURNS: "0"
      SHERPA_HISTORY_MSG_CHARS: "0"
      SHERPA_HISTORY_CHAR_BUDGET: "0"
    expected_values: {history_turns: 0, history_msg_chars: 0, history_char_budget: 0}
    expected: [新規promptへ過去本文をprimingしないがDB履歴は保持]
    observables: [provider-request-summary, postgres, conversation-ui]

  seed-ollama-url-persistence:
    suites: [env]
    marker: env_seed_lifecycle
    case_nodeids: [cases/environment/test_environment.py::test_fresh_env_seed_then_env_change_then_ui_override_persists]
    restart: none
    fresh_database: true
    env: {OLLAMA_URL: "http://127.0.0.1:11434"}
    restart_env: {OLLAMA_URL: "http://127.0.0.1:11435"}
    restart_transition_id: ollama-url-after-seed
    restart_observable:
      kind: admin_ollama_url_seed
      fresh: "http://127.0.0.1:11434"
      transition_env: "http://127.0.0.1:11435"
      ui_override: "http://127.0.0.1:11436"
      fresh_database: true
    expected: [fresh DB seed, 同じDBでenv変更を無視, UI保存値を再起動後も維持]
    observables: [admin-settings, restart-effective-environment, postgres-settings]

  port-mismatch-rejected:
    suites: [env]
    marker: environment
    restart: stack
    fresh_database: true
    env:
      PGPORT: "55432"
      DATABASE_URL: postgresql://sherpa:unused@localhost:5432/sherpa
    expect_startup_failure: true
    expected_failure_stage: port_check
    expected_error_patterns: [PostgreSQL, DATABASE_URL, 不一致]
    expected_error_sources: [port-check-log]
    expected: [不一致をアプリ起動前に拒否]
    observables: [preflight-log, process-exit, open-ports]

  invalid-database-url-rejected:
    suites: [env]
    marker: environment
    restart: stack
    fresh_database: true
    env: {DATABASE_URL: "file:///not-a-postgres-database"}
    expect_startup_failure: true
    expected_failure_stage: isolation
    expected_error_patterns: [DATABASE_URL, scheme]
    expected_error_sources: [runner-message]
    expected: [不正schemeを起動前に拒否]
    observables: [preflight-log, process-exit]

  port-owner-mismatch-run-owned-rejected:
    suites: [env]
    restart: none
    fresh_database: true
    preflight_fixture: occupy_app_port
    expect_startup_failure: true
    expected_failure_stage: port_check
    expected_error_patterns: [アプリ, 他のプロセス]
    expected_error_sources: [port-check-log]
    expected: [runner所有listenerのPIDを記録し、別app所有者として起動前に拒否]
    observables: [preflight-log, process-identity, port-owner-check]

