version: 1
description: >-
  実サービスだけを使うUI自動化の機能台帳。full suiteでは、ここに登録されていない
  HTML画面、ナビゲーション先、フロントエンドAPI呼出しを検出した時点で失敗する。

discovery:
  html_globs:
    - web/*.html
  javascript_globs:
    - web/*.js
    - web/chat/*.js
  route_globs:
    - sherpa/**/*.py
  excluded_paths:
    - path: web/vendor/**
      reason: 追跡済み第三者ライブラリでありSherpaの画面・API契約ではない
  allow_unmapped_routes:
    - route: GET /
      reason: /ui/chat.htmlへのサーバリダイレクトとしてnavigationケースで検証する
    - route: GET /healthz
      reason: ブラウザ起動前の実サービス前提として専用smokeケースで直接検証する
    - route: /ext/v1/**
      reason: ブラウザUIではなく外部連携APIでありadminのキー管理だけをUI対象にする
    - route: /impact/**
      reason: チャットのimpactレンズを通じて実行し、専用APIの契約試験は既存integration層が担う
    - route: /troubleshoot/**
      reason: チャットのtroubleshootレンズを通じて実行する
    - route: /qa/**
      reason: 現行UIではチャットのqaレンズを通じて実サービス上で同じ処理を実行する
    - route: POST /chat
      reason: 現行UIが使用しない旧同期チャット互換APIでありturn APIの画面試験とは分離する
    - route: GET /chat/stream
      reason: 現行UIが使用しない旧ストリーム互換APIでありEventSourceはturn別streamを検証する
    - route: POST /chat/stream/stop
      reason: 現行UIが使用しない旧停止互換APIでありturn別stop操作を画面から検証する
  allow_unresolved_browser_calls:
    - source: web/common.js
      call: fetch
      expression: url
      reason: 共通APIラッパーが呼出元から受け取るURLであり各呼出元の具体URLを別々に静的登録する
    - source: web/chat.js
      call: fetch
      expression: dl.getAttribute('href')
      reason: サーバ回答に描画された原本文書リンクであり実クリック後の応答とdownload証跡をcaseで検証する
  required_viewports:
    desktop: {width: 1440, height: 1000}
    narrow: {width: 390, height: 844}

required_feature_categories:
  - stack-health
  - authentication
  - authorization
  - navigation
  - worlds
  - ingestion
  - ocr
  - vlm
  - office-conversion
  - legacy-office-conversion
  - documents
  - search
  - graph
  - chat
  - thought-flow
  - conversations
  - sharing
  - workspace
  - settings
  - settings-navigation
  - administration
  - audit
  - usage
  - status
  - help
  - accessibility
  - environment
  - evidence
  - verified-sources
  - real-provider-matrix
  - external-api-keys
  - responsive

# These contracts cannot be proven by case PASS alone.  The real provider may
# legitimately stay below the fixed persistence cap, so full coverage remains
# NOT_PROVEN until at least one passing real-service turn records cap_applied.
runtime_evidence_contracts:
  - id: persisted-trace-cap-after-real-turn
    feature: thought-flow
    description: 完全な生SSEを保存上限適用後のPostgres traceへ厳密に畳み込めること
    cases:
      - cases/thought_flow/test_thought_flow.py::test_sse_trace_matches_ui_api_and_database
    artifact: state/persisted-trace-cap-correlation.json
    required_values:
      cap_applied: true

surfaces:
  - id: application-shell
    page: /ui/home.html
    roles: [admin, user]
    features: [stack-health, navigation, status, administration, accessibility, evidence, responsive]
    endpoints:
      - GET /healthz
      - GET /health/summary
      - GET /auth/me
      - GET /announcements
      - POST /admin/announcements
      - PATCH /admin/announcements/{id}
      - DELETE /admin/announcements/{id}
    cases:
      - cases/smoke/test_smoke.py::test_live_stack_health_and_ui_shell
      - cases/navigation/test_navigation.py::test_all_primary_navigation_links
      - cases/navigation/test_navigation.py::test_narrow_viewport_primary_navigation
      - cases/auth/test_auth.py::test_new_user_password_change_and_role_boundary
      - cases/admin/test_admin.py::test_admin_status_audit_usage_and_user_management
      - cases/admin/test_admin.py::test_announcement_create_edit_publish_and_delete_lifecycle
    control_exclusions:
      - key: "@unkeyed:web/common.js:39:a"
        reason: downloadBlobが一時生成して同期click後に破棄する内部anchorであり、利用者が直接操作できる永続controlではない
    controls:
      - ids: [healthdot]
        action: 実serviceの集約healthを表示し管理者を詳細状態画面へ移動する
        states:
          normal: 実storeを含む正常状態を示しstatus画面の実probeへ移動する
          abnormal: service到達不能を正常表示せず一般userには管理詳細linkを与えない
        roles: [admin, user]
        cases: [cases/smoke/test_smoke.py::test_live_stack_health_and_ui_shell]
      - ids: [themebtn]
        action: 画面themeを切り替えてbrowser再読込後も選択を保持する
        states:
          normal: lightとdarkを切り替えてlocal storageから再適用する
          abnormal: 未知のtheme値や再読込で操作不能な表示へしない
        roles: [admin, user]
        cases: [cases/navigation/test_navigation.py::test_all_primary_navigation_links]
      - ids: [topbar-user, um-changepw]
        action: 実login userのmenuを開き安全なpassword変更導線へ移動する
        states:
          normal: 現在userを表示し安全なreturn先を持つ変更画面へ進む
          abnormal: 認証無効時や未認証時に利用不能なuser操作を成功表示しない
        roles: [admin, user]
        cases:
          - cases/auth/test_auth.py::test_login_session_logout
          - cases/navigation/test_navigation.py::test_help_manual_swagger_internal_links_and_keyboard
      - ids: [um-logout]
        action: 操作直前の実session roleを確定してlogoutする
        states:
          normal: 現在の認証済みsessionだけを終了してlogin画面へ戻る
          abnormal: 未認証または別sessionをlogout成功として扱わない
        roles: [admin, user]
        authorization_mode: awaited-pre-action
        cases: [cases/auth/test_auth.py::test_login_session_logout]
      - ids: [turnnotice]
        action: 実行中の実AI turnを全画面共通で通知し同じconversationへ戻る
        states:
          normal: running APIのconversation IDと一致するchatへ遷移して購読を再開する
          abnormal: 完了済みまたは存在しないturnを実行中として表示しない
        roles: [admin, user]
        cases: [cases/thought_flow/test_thought_flow.py::test_running_turn_reload_resume_and_stop]
      - ids: [pf-open, pf-title, pf-body, pf-cat, pf-publish, pf-expire, pf-pinned, pf-cancel, pf-submit]
        action: admin投稿formを開閉し本文、分類、公開期間、pinを指定して実お知らせを投稿する
        states:
          normal: 取消は未送信のまま破棄し投稿は全入力を実APIと一覧へ反映する
          abnormal: 必須不足、逆転した公開期間、取消済み入力を投稿成功にしない
        roles: [admin]
        cases: [cases/admin/test_admin.py::test_announcement_create_edit_publish_and_delete_lifecycle]
      - selectors: ["[data-edit]", "[data-cancel]", "[data-save]", "[data-toggle-pub]", "[data-delete]"]
        action: 動的お知らせ行を編集、取消、保存、公開切替、削除する
        states:
          normal: 選択した実お知らせだけを変更しAPIと再描画へ反映する
          abnormal: 取消操作や別お知らせを保存・削除しない
        roles: [admin]
        cases: [cases/admin/test_admin.py::test_announcement_create_edit_publish_and_delete_lifecycle]
      - hrefs: [home.html, chat.html, ingest.html, graph.html, manual.html, settings.html, workspace.html, admin-settings.html]
        action: 共通navigationから各主要画面へ実際に移動する
        states:
          normal: 選択した登録済み画面へ遷移し認証済みUIを表示する
          abnormal: 壊れたhrefや権限外画面を正常な遷移として扱わない
        roles: [admin, user]
        cases: [cases/navigation/test_navigation.py::test_all_primary_navigation_links]
      - id_prefixes: [ef-title-, ef-cat-, ef-body-, ef-publish-, ef-expire-, ef-pinned-]
        action: 選択した実お知らせの動的編集欄へ値を入力する
        states:
          normal: 対象お知らせの各項目だけを編集して保存結果へ反映する
          abnormal: 別のお知らせや無効な公開期間を保存成功にしない
        roles: [admin]
        cases: [cases/admin/test_admin.py::test_announcement_create_edit_publish_and_delete_lifecycle]
      - selectors: [".home-cta"]
        action: homeの主要導線から実AI chat画面へ移動する
        states:
          normal: 認証済みchat画面へ移動して質問入力を利用可能にする
          abnormal: 認証切れや遷移失敗を利用可能なchatとして表示しない
        roles: [admin, user]
        cases: [cases/navigation/test_navigation.py::test_all_primary_navigation_links]
    viewports: [desktop, narrow]

  - id: login
    page: /ui/login.html
    roles: [anonymous]
    features: [authentication, authorization, accessibility, evidence]
    endpoints:
      - POST /auth/login
      - GET /auth/me
    cases:
      - cases/auth/test_auth.py::test_anonymous_redirect_and_auth_disabled_profile
      - cases/auth/test_auth.py::test_login_session_logout
      - cases/auth/test_auth.py::test_new_user_password_change_and_role_boundary
    controls:
      - ids: [username, password]
        action: 実session開始用の資格情報を入力する
        states:
          normal: 正しい資格情報を入力欄へ保持して送信可能にする
          abnormal: 空欄や不正資格情報を認証済み状態として表示しない
        roles: [anonymous]
        cases: [cases/auth/test_auth.py::test_login_session_logout]
      - ids: [submit]
        action: 操作直前のanonymous roleを確定して実login APIへ資格情報を送信する
        states:
          normal: 正しい資格情報で初回変更または遷移先へ進む
          abnormal: 不正資格情報を拒否し認証済み画面へ進ませない
        roles: [anonymous]
        authorization_mode: awaited-pre-action
        cases: [cases/auth/test_auth.py::test_login_session_logout]
    viewports: [desktop, narrow]

  - id: change-password
    page: /ui/change-password.html
    roles: [admin, user]
    features: [authentication, authorization, accessibility, evidence]
    endpoints:
      - GET /auth/me
      - POST /auth/change-password
      - POST /auth/logout
    cases:
      - cases/auth/test_auth.py::test_new_user_password_change_and_role_boundary
      - cases/auth/test_auth.py::test_login_session_logout
    controls:
      - ids: [current-password, new-password, confirm-password, submit]
        action: 初回または任意のパスワード変更を確定する
        states:
          normal: 現在値と一致する強い新パスワードを保存する
          abnormal: 不一致または不正な新パスワードを拒否する
        roles: [admin, user]
        cases: [cases/auth/test_auth.py::test_new_user_password_change_and_role_boundary]
    viewports: [desktop, narrow]

  - id: chat
    page: /ui/chat.html
    roles: [admin, user]
    features:
      - chat
      - thought-flow
      - conversations
      - sharing
      - workspace
      - search
      - evidence
      - verified-sources
      - real-provider-matrix
      - accessibility
      - responsive
    endpoints:
      - GET /world-options
      - GET /scopes
      - GET /conversations
      - GET /conversations/{cid}
      - PATCH /conversations/{cid}
      - DELETE /conversations/{cid}
      - POST /conversations/{cid}/pin
      - POST /chat/turns
      - GET /chat/turns/{turn_id}/stream
      - GET /chat/turns/running
      - POST /chat/turns/{turn_id}/stop
      - GET /users/suggest
      - POST /conversations/{cid}/shares
      - POST /conversation-shares/{share_id}/revoke
      - POST /workspace/files
      - GET /workspace/files/{file_id}/download
      - GET /settings
      - PUT /settings
      - POST /settings/test
    cases:
      - cases/chat/test_chat.py::test_real_ai_chat_persists_usage_trace_and_audit
      - cases/chat/test_chat.py::test_real_impact_filter_and_reference_graph_controls
      - cases/chat/test_chat.py::test_ext23_verified_and_reference_sources
      - cases/chat/test_chat.py::test_real_provider_profile_uses_selected_service
      - cases/chat/test_lifecycle.py::test_codex_created_artifact_downloads_from_real_workspace
      - cases/chat/test_lifecycle.py::test_codex_native_resume_fallback_and_new_session
      - cases/chat/test_lifecycle.py::test_followup_session_rename_pin_switch_and_delete
      - cases/chat/test_chat_controls.py::test_chat_panel_font_brain_scope_and_personal_controls
      - cases/chat/test_chat_controls.py::test_chat_upload_button_and_file_input_store_real_workspace_file
      - cases/chat/test_failure_profiles.py::test_expired_session_rejects_turn_and_releases_slot
      - cases/chat/test_failure_profiles.py::test_real_provider_timeout_is_error_and_releases_slot
      - cases/chat/test_failure_profiles.py::test_real_codex_cli_nonzero_is_error_and_releases_slot
      - cases/chat/test_subagent_planner.py::test_real_openai_planner_delegates_to_real_subagent
      - cases/auth/test_auth.py::test_new_user_password_change_and_role_boundary
      - cases/thought_flow/test_thought_flow.py::test_sse_trace_matches_ui_api_and_database
      - cases/thought_flow/test_thought_flow.py::test_running_turn_reload_resume_and_stop
      - cases/thought_flow/test_runtime_behaviors.py::test_confirmation_card_persists_and_resumes_real_turn
      - cases/thought_flow/test_runtime_behaviors.py::test_eventsource_disconnect_reloads_and_replays_same_real_turn
      - cases/thought_flow/test_runtime_behaviors.py::test_real_concurrent_turn_limit_has_no_rejected_conversation_side_effect
      - cases/thought_flow/test_runtime_behaviors.py::test_server_restart_does_not_mark_interrupted_turn_complete
    control_exclusions:
      - key: "@unkeyed:web/chat.js:177:textarea"
        reason: clipboard拒否時だけ一時生成され即時削除されるfallback textareaであり、利用者が直接操作するcontrolではない
    controls:
      - ids: [newbtn, exportbtn]
        action: 会話を新規作成または成果物として書き出す
        states:
          normal: 操作対象の会話が利用可能で処理が完了する
          abnormal: 対象なしまたは処理失敗を成功表示にしない
        roles: [admin, user]
        cases:
          - cases/chat/test_lifecycle.py::test_followup_session_rename_pin_switch_and_delete
          - cases/chat/test_lifecycle.py::test_codex_created_artifact_downloads_from_real_workspace
      - ids: [sideclose, sideopen, fontbtn, rightopen, rightclose, brainbadge]
        action: 会話画面の左右panelと表示補助を切り替える
        states:
          normal: desktopと狭幅で対象panelまたは表示状態を切り替える
          abnormal: 狭幅でも主要操作を隠したまま復帰不能にしない
        roles: [admin, user]
        cases:
          - cases/navigation/test_navigation.py::test_narrow_viewport_primary_navigation
          - cases/chat/test_lifecycle.py::test_followup_session_rename_pin_switch_and_delete
          - cases/chat/test_chat_controls.py::test_chat_panel_font_brain_scope_and_personal_controls
      - ids: [version, kbtoggle, scopebtn, personaltoggle]
        action: World、scope、個人領域を実チャットへ適用する
        states:
          normal: 選択scopeの根拠だけで回答する
          abnormal: 未選択または権限外scopeを回答根拠に混ぜない
        roles: [admin, user]
        cases:
          - cases/chat/test_chat.py::test_real_ai_chat_persists_usage_trace_and_audit
          - cases/thought_flow/test_thought_flow.py::test_sse_trace_matches_ui_api_and_database
          - cases/chat/test_chat_controls.py::test_chat_panel_font_brain_scope_and_personal_controls
        selector_sources: [ui_automation/support/chat_flow.py]
      - ids: [chat-upload-btn, chat-file-input]
        action: 実ファイルを会話workspaceへ追加する
        states:
          normal: 許可されたファイルをuploadし会話で利用する
          abnormal: 不正形式またはupload失敗を添付済みにしない
        roles: [admin, user]
        cases:
          - cases/chat/test_lifecycle.py::test_codex_created_artifact_downloads_from_real_workspace
          - cases/chat/test_chat_controls.py::test_chat_upload_button_and_file_input_store_real_workspace_file
      - ids: [input, send]
        action: 質問を送信し実turnを開始または停止する
        states:
          normal: SSEと画面traceを相関して完了する
          abnormal: 同時実行制限、切断、停止を誤って完了扱いしない
        roles: [admin, user]
        cases:
          - cases/chat/test_chat.py::test_real_ai_chat_persists_usage_trace_and_audit
          - cases/thought_flow/test_runtime_behaviors.py::test_real_concurrent_turn_limit_has_no_rejected_conversation_side_effect
          - cases/chat/test_failure_profiles.py::test_expired_session_rejects_turn_and_releases_slot
          - cases/chat/test_failure_profiles.py::test_real_provider_timeout_is_error_and_releases_slot
          - cases/chat/test_failure_profiles.py::test_real_codex_cli_nonzero_is_error_and_releases_slot
        selector_sources: [ui_automation/support/chat_flow.py]
      - ids: [sharebtn, share-close, share-invitees, share-days, share-submit, share-cancel, share-copy]
        action: 会話共有を作成、copy、取消する
        states:
          normal: 招待相手と期限を反映した共有URLを発行する
          abnormal: 無効入力または取消済み共有を利用可能にしない
        roles: [admin, user]
        cases: [cases/chat/test_lifecycle.py::test_share_url_acceptance_and_revocation]
      - selectors: ["[data-fs]", "[data-exec]", "[data-cfg]", "[data-scope]"]
        action: 動的menuから文字サイズ、実行provider、設定導線、検索scopeを選択する
        states:
          normal: 選択結果が画面状態または設定画面への遷移へ反映される
          abnormal: 利用不能なproviderやscopeを選択済みとして見せない
        roles: [admin, user]
        cases: [cases/chat/test_chat_controls.py::test_chat_panel_font_brain_scope_and_personal_controls]
      - ids: [bm-modelinput, bm-modelsave, bm-modeltest]
        action: quick menuで実providerのmodelを保存し実接続probeを実行する
        states:
          normal: 保存したmodelとproviderを設定APIで照合し実providerの接続成功を確認する
          abnormal: 資格情報不足、到達不能、存在しないmodelを接続成功にしない
        roles: [admin, user]
        cases: [cases/chat/test_chat_controls.py::test_chat_panel_font_brain_scope_and_personal_controls]
      - selectors: ["[data-ex]", "[data-qopt]", "[data-qfree]", "[data-ask-submit]"]
        action: 質問例または確認cardの選択肢と自由入力から実turnを続行する
        states:
          normal: 選択内容を同じturnへ結び付けて実行を再開する
          abnormal: 未回答または別turnの回答を完了として扱わない
        roles: [admin, user]
        cases:
          - cases/chat/test_chat_controls.py::test_chat_panel_font_brain_scope_and_personal_controls
          - cases/thought_flow/test_runtime_behaviors.py::test_confirmation_card_persists_and_resumes_real_turn
      - selectors: ["[data-cites]", "[data-filter]", "[data-rg]"]
        action: 実回答の引用、根拠filter、参照graphを展開して対応する根拠を確認する
        states:
          normal: 実turnが返した根拠だけを展開またはfilterする
          abnormal: 根拠なし回答に偽の引用やgraphを生成しない
        roles: [admin, user]
        cases:
          - cases/chat/test_chat.py::test_real_ai_chat_persists_usage_trace_and_audit
          - cases/chat/test_chat.py::test_real_impact_filter_and_reference_graph_controls
      - selectors: ["[data-showtrace]"]
        action: 保存済み実回答から同じturnの構造化実行traceを開いて表示する
        states:
          normal: 対応するturnだけを展開し保存済みdone nodeを表示する
          abnormal: traceのない回答や別turnのtraceを表示しない
        roles: [admin, user]
        cases: [cases/chat/test_chat.py::test_real_ai_chat_persists_usage_trace_and_audit]
      - selectors: ["[data-copy]", "[data-export]"]
        action: 実回答本文をclipboardまたはdownload可能な成果物へ書き出す
        states:
          normal: 表示中の実回答内容と書き出し内容が一致する
          abnormal: 空回答または書き出し失敗を完了表示にしない
        roles: [admin, user]
        cases: [cases/chat/test_chat.py::test_real_ai_chat_persists_usage_trace_and_audit]
      - selectors: ["[data-exp]"]
        action: 会話全体を選択形式でdownloadする
        states:
          normal: 選択形式と実会話内容が一致するfileを生成する
          abnormal: 空会話や生成失敗をdownload成功にしない
        roles: [admin, user]
        cases: [cases/chat/test_lifecycle.py::test_followup_session_rename_pin_switch_and_delete]
      - selectors: ["[data-pin]", "[data-rename]", "[data-del]", "[data-sharecid]"]
        action: 動的会話行をpin、rename、delete、shareする
        states:
          normal: 対象conversationだけを変更し再読込後も結果を保持する
          abnormal: 共有受信または権限外conversationの変更を許可しない
        roles: [admin, user]
        cases:
          - cases/chat/test_lifecycle.py::test_followup_session_rename_pin_switch_and_delete
          - cases/chat/test_lifecycle.py::test_share_url_acceptance_and_revocation
      - selectors: ["[data-pick-invitee]", "[data-rm-invitee]"]
        action: 実user候補を共有相手へ追加し、選択済み候補を取り除く
        states:
          normal: 選択した実userだけを共有対象へ含める
