[pytest]
testpaths = cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config
markers =
    ui_automation: 独立した実サービスUI試験
    ui_live: 起動済みSherpaと実ストアを操作するUI試験
    smoke: 実stackと主要画面の最小確認
    auth: 認証と権限境界の確認
    navigation: ナビゲーションと狭幅画面の確認
    worlds_ingest: 実World登録と取り込みの確認
    search_graph: 実検索とグラフの確認
    chat: 実AIチャットと会話永続化の確認
    thought_flow: SSE・UI・DBの構造化実行トレース照合
    settings: 個人設定と全体設定の確認
    workspace: 実個人領域の確認
    admin: 管理画面、監査、利用量の確認
    environment: 環境変数の反映・境界・起動拒否の確認
    destructive: runner所有の隔離stackだけを変更・削除する確認
    destructive_isolated: 専用stack内だけで削除や再作成を行う確認
    requires_openai: 実OpenAI接続と課金が発生する確認
    requires_codex: 認証済みCodex CLIを実行する確認
    requires_ollama: 実Ollamaモデルを実行する確認
    requires_ocr: 実OCR workerとモデルを実行する確認
    requires_office: 実Office変換を実行する確認
