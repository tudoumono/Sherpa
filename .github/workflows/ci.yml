name: ci

# push・PR のたびに基本セット（ruff・単体テスト全件・契約テスト・壁時計予算チェック）を回す
# 二重確認（開発ハーネス正典の段階表・提案書 S3）。結合テスト・ブラウザ結合テストは CI 化しない
# （手元の `make gate-merge`／`make gate-release` に委ねる）。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sherpa
          POSTGRES_PASSWORD: sherpa_dev
          POSTGRES_DB: sherpa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHERPA_PG_DSN: postgresql://sherpa:sherpa_dev@localhost:5432/sherpa
      SHERPA_USE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run gate-ci (ruff + unit + contract, budget-checked)
        run: make gate-ci
