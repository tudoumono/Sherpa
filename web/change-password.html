<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sherpa — パスワード変更</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="fonts.css">
<script>document.documentElement.dataset.theme = localStorage.getItem('sherpa-theme') || 'light';</script>
<script src="common.js"></script>
<script src="nav.js"></script>   <!-- topbar は置かないが、テーマ等の共通初期化に共用 -->
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);padding:20px}
  .change-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:32px 36px;width:min(420px,100%);box-shadow:var(--shadow-lg)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand-row .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-size:16px}
  .brand-row b{font-size:18px;font-weight:700}
  .brand-row small{color:var(--ink-3);font-size:12px;display:block}
  h1{font-size:16px;margin:0 0 6px}
  .lead{font-size:12.5px;color:var(--ink-3);line-height:1.65;margin-bottom:18px}
  .field-row{margin-bottom:13px}
  .field-row label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .field-row input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--border);
    border-radius:var(--radius-sm);font-family:inherit;font-size:14px;background:var(--surface);
    color:var(--ink);outline:none}
  .field-row input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
  .msg{font-size:12.5px;padding:9px 12px;border-radius:var(--radius-sm);margin-bottom:14px;display:none}
  .msg.show{display:block}
  .msg.err{background:var(--danger-bg);color:var(--danger)}
  .msg.ok{background:var(--ok-bg);color:var(--ok)}
  .submit{width:100%;height:40px;border:none;border-radius:var(--radius-sm);background:var(--accent);
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:4px}
  .submit:disabled{opacity:.6;cursor:not-allowed}
  .hint{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div class="change-card">
  <div class="brand-row">
    <div class="mark">⛰</div>
    <div><b>Sherpa</b><small>業務AI基盤</small></div>
  </div>
  <h1>パスワードを変更してください</h1>
  <div class="lead">初期 admin または仮パスワードでログインした場合、通常画面へ進む前に新しいパスワードが必要です。</div>
  <div class="msg err" id="err"></div>
  <div class="msg ok" id="ok"></div>
  <form id="form" autocomplete="on">
    <div class="field-row">
      <label for="current-password">現在のパスワード</label>
      <input id="current-password" name="current-password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field-row">
      <label for="new-password">新しいパスワード</label>
      <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field-row">
      <label for="confirm-password">新しいパスワード（確認）</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button class="submit" id="submit" type="submit">変更して続ける</button>
  </form>
  <div class="hint">8文字以上、半角英数字・記号のみ（全角文字・空白不可）。ユーザー名、admin、password、初期パスワードと同じものは使えません。</div>
</div>
<script src="change-password.js"></script>
</body>
</html>
