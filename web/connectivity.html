<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slouch — つながりの確認</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="fonts.css">
<script>document.documentElement.dataset.theme = localStorage.getItem('sherpa-theme') || 'light';</script>
<script src="common.js"></script>
<script src="nav.js"></script>
<style>
  .wrap2{max-width:1100px;margin:0 auto}
  /* システム管理のタブから iframe（?embed=1）で開かれた時だけ、共通トップバー/ナビを隠す（connectivity.js 冒頭が判定）。 */
  .embedded .topbar,.embedded nav{display:none}
  .embedded .wrap{padding-top:8px}
  table{width:100%;border-collapse:collapse;font-size:var(--text-label)}
  th{text-align:left;font-size:var(--text-small);font-weight:600;color:var(--ink-3);padding:7px 10px;
    border-bottom:2px solid var(--border);white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:top}
  tr:hover td{background:var(--surface-2)}
  .state-cell{white-space:nowrap;font-weight:600}
  .host-cell{font-family:var(--font-code,monospace);font-size:var(--text-caption);color:var(--ink-3);overflow-wrap:anywhere}
  .reason-cell{max-width:360px;font-size:var(--text-caption);color:var(--ink-3)}
  .time-cell{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #access-denied{display:none;text-align:center;padding:60px 20px;color:var(--ink-3)}
  .empty-row td{text-align:center;color:var(--ink-3);padding:24px}
</style>
</head>
<body>
<sherpa-topbar></sherpa-topbar>

<div class="wrap">
  <div id="access-denied">
    <div style="font-size:32px;margin-bottom:12px">🚫</div>
    <div style="font-size:var(--text-body);font-weight:700;margin-bottom:8px">アクセス権限がありません</div>
    <div style="font-size:var(--text-label)">管理者権限が必要です。</div>
  </div>
  <div id="main-content">
    <div class="pagehead">
      <div>
        <a class="crumb" href="admin-settings.html">← システム管理</a>
        <h1>つながりの確認</h1>
        <div class="sub">画面・回答・調べものの道具・取り込みの係・回答を作る Codex が、それぞれ実際に使う経路で各サービスにつながるかを確かめます。</div>
      </div>
    </div>

    <div class="wrap2">
      <div class="card">
        <div class="card-head">
          <span class="ico">🔌</span>
          <div>
            <div class="title">確認する</div>
            <div class="sub" id="checked-at">まだ確かめていません</div>
          </div>
          <div class="spacer"></div>
          <div class="btnrow">
            <button class="btn-secondary" id="check-free-btn">確かめる</button>
            <button class="btn-secondary" id="check-paid-btn">お金のかかる分も確かめる</button>
          </div>
        </div>
        <div class="card-body"><div class="hint">「確かめる」は無料の分だけです。お金のかかる分（埋め込み・回答の AI・Codex を OpenAI で使う場合）は、短い文を 1 回ずつ送ります。</div></div>
      </div>

      <div id="paths"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="connectivity.js"></script>
</body>
</html>
